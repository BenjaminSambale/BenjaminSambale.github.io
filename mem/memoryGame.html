<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mnemoria</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="memoryGame.css">
</head>
<body>
    <div class="container">
        <h1>Mnemoria</h1>
        <div class="top-bar">
            <div class="mode-tabs">
                <button id="modeClassic" class="active">Classic</button>
                <button id="modeTimed">Timed</button>
            </div>
            <div class="settings" id="settingsClassic">
                <label for="digits">Digits:</label>
                <input type="number" id="digits" value="10" min="1" max="100">
            </div>
            <div class="settings hidden" id="settingsTimed">
                <label for="timeLimit">Seconds:</label>
                <input type="number" id="timeLimit" value="10" min="1" max="300">
            </div>
        </div>
        <div class="display-area">
            <div id="display" class="number"></div>
            <div id="comparison"></div>
        </div>
        <textarea id="userInput" placeholder="Type the number…" inputmode="numeric" autocomplete="off" spellcheck="false"></textarea>
        <button id="actionButton">Start</button>
        <div id="timer"></div>
        <p id="result"></p>
        <hr>
        <div id="highscores"></div>
        <p class="hint"><a href="https://en.wikipedia.org/wiki/World_Memory_Championships#Records" target="_blank" rel="noopener noreferrer">Wei Qinru</a> memorized 642 digits in 5 minutes.</p>
        <p class="hint">Too hard? Learn the <a href="https://en.wikipedia.org/wiki/Method_of_loci" target="_blank" rel="noopener noreferrer">loci method</a>.</p> 
    </div>
    
    <script src="memoryGame.js"></script>
</body>
</html>
